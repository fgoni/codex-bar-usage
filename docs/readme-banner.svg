<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CodexResetBar banner</title>
  <desc id="desc">A dark product banner for CodexResetBar showing the app icon and a simulated macOS menu bar reset timer.</desc>
  <defs>
    <linearGradient id="bg" x1="102" y1="42" x2="1190" y2="492" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E252B"/>
      <stop offset="0.55" stop-color="#101419"/>
      <stop offset="1" stop-color="#1A1113"/>
    </linearGradient>
    <radialGradient id="teal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 142) rotate(33) scale(560 420)">
      <stop stop-color="#49A3B0" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#49A3B0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coral" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1030 416) rotate(-144) scale(580 390)">
      <stop stop-color="#CC7C5E" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#CC7C5E" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1280" height="520" rx="34" fill="url(#bg)"/>
  <rect width="1280" height="520" rx="34" fill="url(#teal)"/>
  <rect width="1280" height="520" rx="34" fill="url(#coral)"/>

  <g filter="url(#softShadow)">
    <rect x="92" y="96" width="236" height="236" rx="56" fill="#101419"/>
    <rect x="92" y="96" width="236" height="236" rx="56" fill="#49A3B0" fill-opacity="0.16"/>
    <rect x="92" y="96" width="236" height="236" rx="56" stroke="white" stroke-opacity="0.1" stroke-width="2"/>
    <circle cx="166" cy="193" r="34" fill="white"/>
    <circle cx="254" cy="193" r="37" fill="white"/>
    <rect x="154" y="262" width="112" height="38" rx="19" fill="white" fill-opacity="0.14"/>
    <path d="M191 281a17 17 0 1 0 5-12" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <path d="M199 266v18h-18" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="218" y="271" width="36" height="7" rx="3.5" fill="white" fill-opacity="0.85"/>
    <rect x="218" y="285" width="24" height="7" rx="3.5" fill="white" fill-opacity="0.65"/>
  </g>

  <text x="380" y="177" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="700" letter-spacing="0">CodexResetBar</text>
  <text x="383" y="231" fill="#D7DDE2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="450">Keep Claude and Codex 5-hour reset timers visible in the macOS menu bar.</text>

  <g filter="url(#softShadow)">
    <rect x="382" y="292" width="558" height="72" rx="22" fill="#0C0F13" fill-opacity="0.9"/>
    <rect x="382" y="292" width="558" height="72" rx="22" stroke="white" stroke-opacity="0.1"/>
    <circle cx="428" cy="328" r="12" fill="white"/>
    <text x="451" y="337" fill="white" font-family="SF Mono, ui-monospace, Menlo, monospace" font-size="25" font-weight="600">2h20m</text>
    <circle cx="583" cy="328" r="12" fill="white"/>
    <text x="606" y="337" fill="white" font-family="SF Mono, ui-monospace, Menlo, monospace" font-size="25" font-weight="600">1h48m</text>
    <rect x="750" y="311" width="146" height="34" rx="17" fill="white" fill-opacity="0.08"/>
    <text x="772" y="335" fill="#D7DDE2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="550">Providers</text>
  </g>

  <text x="383" y="415" fill="#9EA9B3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">Built by Facundo Goni · powered by the CodexBar CLI</text>
</svg>
